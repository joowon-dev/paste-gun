<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// 앱 아이콘과 메뉴바 아이콘. 총 그림은 앱이 쓰는 것(src/render/draw.js) 그대로다.
//   icon.html        → 앱 아이콘 (쇠판 위의 권총, 총구에서 글자가 나간다)
//   icon.html?tray   → 메뉴바 아이콘 (검정 실루엣 — macOS 가 색을 입힌다)
import { GUN_SHAPES, paintGun, paintFlash, traceGun } from '../src/render/draw.js'

const tray = location.search.includes('tray')
// 헤드리스 크롬은 창을 아주 작게는 못 만든다. 크기를 창에서 읽지 않고 받아 온다.
const size = Number(new URLSearchParams(location.search).get("size")) || innerWidth
const canvas = document.getElementById('c')
canvas.width = canvas.height = size
const ctx = canvas.getContext('2d')
const gun = GUN_SHAPES.pistol

const xs = gun.parts.flatMap((p) => p.points.map((q) => q[0]))
const ys = gun.parts.flatMap((p) => p.points.map((q) => q[1]))
const box = { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }

function place(width, cx, cy, tilt) {
  const scale = width / box.w
  ctx.translate(cx, cy)
  ctx.rotate(tilt)
  ctx.scale(scale, scale)
  ctx.translate(-box.x - box.w / 2, -box.y - box.h / 2)
}

if (tray) {
  place(size * 0.86, size / 2, size / 2, 0)
  ctx.fillStyle = '#000'
  ctx.strokeStyle = '#000'
  ctx.lineJoin = 'round'
  traceGun(ctx, gun)
  ctx.fill()
  ctx.lineWidth = 1.2
  ctx.stroke()
  for (const line of gun.lines) {
    if (line.width < 1.1) continue
    ctx.beginPath()
    line.points.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)))
    ctx.lineWidth = line.width + 0.6
    ctx.stroke()
  }
} else {
  // macOS 아이콘 격자: 1024 중 824 가 몸, 모서리 반지름은 그 22% 쯤.
  const pad = size * 0.098
  const side = size - pad * 2
  const r = side * 0.225
  ctx.beginPath()
  ctx.roundRect(pad, pad, side, side, r)
  const plate = ctx.createLinearGradient(0, pad, 0, pad + side)
  plate.addColorStop(0, '#2b3442')
  plate.addColorStop(1, '#141a23')
  ctx.fillStyle = plate
  ctx.fill()
  ctx.save()
  ctx.clip()
  // 총구 쪽에서 번지는 불빛.
  const glow = ctx.createRadialGradient(size * 0.78, size * 0.36, 0, size * 0.78, size * 0.36, size * 0.5)
  glow.addColorStop(0, 'rgba(255, 190, 90, 0.42)')
  glow.addColorStop(1, 'rgba(255, 190, 90, 0)')
  ctx.fillStyle = glow
  ctx.fillRect(0, 0, size, size)
  ctx.restore()
  ctx.lineWidth = size * 0.006
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'
  ctx.stroke()

  ctx.save()
  place(side * 0.6, size * 0.43, size * 0.56, -0.2)
  paintFlash(ctx, gun, 1, 0.8)
  paintGun(ctx, gun)
  ctx.restore()

  // 총구에서 나가는 글자.
  ctx.save()
  ctx.translate(size * 0.79, size * 0.3)
  ctx.rotate(-0.2)
  ctx.font = `800 ${size * 0.2}px 'DIN Alternate', 'Helvetica Neue', sans-serif`
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  ctx.shadowColor = 'rgba(255, 170, 60, 0.9)'
  ctx.shadowBlur = size * 0.05
  ctx.fillStyle = '#ffe9b8'
  ctx.fillText('V', 0, 0)
  ctx.restore()
}
</script>
